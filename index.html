<!DOCTYPE html>
<html>

<head>
  <title>Website Title</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.png">
  <script defer src="script.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
</head>

<body>
  <div id="uploadPage">
    <h1>PDF Reader</h1>
    <div class="fileUploadArea">
      <div class="fileUploadAreaMarginBar"></div>
      <h2 class="fileUploadAreaTitle">Upload A PDF file</h2>
      <div class="fileUploadAreaMarginBar"></div>
      <div class="fileFormWrapper">
        <div id="fileDropArea">
          <div>
            Drag and Drop your File Here
            <div class="orLabel">
              <p>OR</p>
            </div>
            <div class="fileUploadButtonWrapper">
              <div>Browse Files</div>
              <input id="fileInput" type="file" accept=".pdf">
            </div>
          </div>
        </div>

      </div>
      <button id="openBtn">Open</button>
    </div>

  </div>
  <div id="viewerPage">

  </div>
</body>

</html>
