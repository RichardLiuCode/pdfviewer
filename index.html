<!DOCTYPE html>
<html>

<head>
  <title>Free Online PDF Reader | No ADS, No Sign up required</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="PDF ICON.png">
  <script defer src="script.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
</head>

<body>
  <div id="uploadPage">
    <div class="titleWrapper">
      <h1>PDF Reader</h1>
    </div>
    <div class="BodyWrapper1">
      <div class="fileUploadArea">
        <div class="fileUploadAreaMarginBar"></div>
        <h2 class="fileUploadAreaTitle">Upload a PDF file</h2>
        <div class="fileUploadAreaMarginBar"></div>
        <div class="fileFormWrapper">
          <div>
            <div id="fileDropArea">
              <div>
                Drag and Drop your File Here
                <div class="orLabel">
                  <p>OR</p>
                </div>
                <button class="fileUploadButtonWrapper">
                  <div>Browse Files</div>
                  <input id="fileInput" type="file" accept=".pdf">
                </button>
                <p class="fileNamePreview">
                  <img src="PDF ICON.png" alt="PDF File ICON">
                  <span id="FileNamePreviewLabel">FileName.pdf</span>
                </p>
              </div>
            </div>
            <div class="fileOpenButtonWrapper">
              <button id="openBtn">Open</button>
            </div>
          </div>

        </div>
      </div>
    </div>
    <div id="viewerPage">

    </div>
</body>

</html>
